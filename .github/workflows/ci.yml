name: Transport and isolation tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transport:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout including pinned upstream study
        uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify upstream provenance
        shell: bash
        run: |
          test "$(git -C upstream/agent-scaling rev-parse HEAD)" = "8673d6a8d5a764a07b08e4283492380d80257223"
      - name: Run deterministic tests (no model/API requests)
        run: python -m unittest discover -s tests -v
      - name: Run role dispatch smoke
        run: python role_queue.py
