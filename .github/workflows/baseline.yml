name: Finance-Agent experiment (manual billed runs)
on:
  workflow_dispatch:
    inputs:
      model:
        description: "LiteLLM model id (defaults to upstream published example)"
        type: choice
        options:
          - openai/gpt-5-mini
          - openai/gpt-5-nano
          - openai/gpt-5
        default: openai/gpt-5-mini
        required: true
      arm:
        description: "Architecture (all = S, M, Q; may incur substantial API charges)"
        type: choice
        options:
          - single
          - multi
          - queue
          - all
        default: single
        required: true
      max_instances:
        description: "Tasks per arm, 1-50. BILLED API calls: default is smoke test only"
        type: choice
        options:
          - '1'
          - '3'
          - '10'
          - '50'
        default: '1'
        required: true
permissions:
  contents: read
concurrency:
  group: finance-agent-baselines
  cancel-in-progress: false
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      PYTHONUNBUFFERED: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Check secrets before incurring API costs
        run: |
          test -n "$OPENAI_API_KEY" || { echo 'Missing OPENAI_API_KEY secret' >&2; exit 1; }
          test -n "$TAVILY_API_KEY" || { echo 'Missing TAVILY_API_KEY secret' >&2; exit 1; }
      - name: Checkout pinned upstream
        uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - name: Check upstream provenance
        run: test "$(git -C upstream/agent-scaling rev-parse HEAD)" = '8673d6a8d5a764a07b08e4283492380d80257223'
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install upstream environment
        working-directory: upstream/agent-scaling
        run: uv sync --prerelease=allow
      - name: Fetch and normalize Finance-Agent tasks
        working-directory: upstream/agent-scaling
        run: bash scripts/setup_finance_agent.sh
      - name: Verify Q integration is loadable
        working-directory: upstream/agent-scaling
        run: |
          uv run --no-sync python - <<'PYCODE'
          import pathlib, sys
          sys.path.insert(0, str(pathlib.Path.cwd().parents[1]))
          from bloodninja.adapter import register_queued_agent
          register_queued_agent()
          from agent_scaling.agents.registry import get_agent_cls
          assert get_agent_cls('single-worker-queued').__name__ == 'SingleWorkerQueued'
          print('Queue adapter registered successfully')
          PYCODE
      - name: Execute selected research arm(s)
        working-directory: upstream/agent-scaling
        env:
          MODEL: ${{ inputs.model }}
          N_TASKS: ${{ inputs.max_instances }}
          SELECTED_ARM: ${{ inputs.arm }}
        run: |
          set -euo pipefail
          case "$SELECTED_ARM" in
            single) ARMS=(single-agent);;
            multi) ARMS=(multi-agent-centralized);;
            queue) ARMS=(single-worker-queued);;
            all) ARMS=(single-agent multi-agent-centralized single-worker-queued);;
            *) echo "Invalid architecture" >&2; exit 1;;
          esac
          for ARM in "${ARMS[@]}"; do
            echo "Running ${ARM}, model=${MODEL}, tasks=${N_TASKS}"
            ENTRYPOINT=(scripts/run_experiment.py)
            if [[ "$ARM" == "single-worker-queued" ]]; then
              ENTRYPOINT=(../../bloodninja/launch.py)
            fi
            uv run --no-sync python "${ENTRYPOINT[@]}" \
              "agent=${ARM}" dataset=finance-agent "llm.model=${MODEL}" \
              "max_instances=${N_TASKS}" debug=false num_workers=1 \
              llm.params.temperature=0.0 use_disk_cache=false log_langfuse=false
          done
      - name: Copy aggregate scores only; never upload transcripts
        if: always()
        shell: bash
        run: |
          mkdir -p metrics
          find upstream/agent-scaling/exp_outputs -name dataset_eval_metrics.json -print0 2>/dev/null |
            while IFS= read -r -d '' p; do
              dest="metrics/$(printf '%s' "$p" | sha256sum | cut -c1-16).json"
              cp "$p" "$dest"
            done
          echo "Files collected: $(find metrics -name '*.json' | wc -l)"
      - name: Export paired task-level scores (no prompts or answers)
        if: always()
        shell: bash
        run: |
          if [[ -d upstream/agent-scaling/.venv ]]; then
            cd upstream/agent-scaling
            uv run --no-sync python ../../bloodninja/export_metrics.py \
              --root exp_outputs --out ../../metrics/paired-task-metrics.csv
            cd ../..
            if [[ "${{ inputs.arm }}" == "all" ]] && \
                [[ -s metrics/paired-task-metrics.csv ]]; then
              python analyze.py metrics/paired-task-metrics.csv --reps 4000 \
                > metrics/paired-bootstrap.txt || \
                echo "Paired scores unavailable: at least one architecture incomplete" \
                  > metrics/paired-bootstrap.txt
            fi
          else
            echo "No installed experiment environment; no scores to extract"
          fi
      - name: Upload de-identified experiment metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-agent-experiment-metrics
          path: metrics/*
          if-no-files-found: warn
          retention-days: 30
