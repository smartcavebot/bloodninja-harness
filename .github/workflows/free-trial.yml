name: Finance-Agent free-tier trial (manual)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/free-trial.yml'
  workflow_dispatch:
    inputs:
      model:
        description: "Groq free-plan model: eligible accounts, subject to token/rate limits"
        type: choice
        options:
          - groq/qwen/qwen3.8-27b
          - groq/openai/gpt-oss-20b
          - groq/openai/gpt-oss-120b
        default: groq/qwen/qwen3.8-27b
        required: true
      arm:
        description: "Choose single first; all runs S/M/Q and uses more free quota"
        type: choice
        options:
          - single
          - multi
          - queue
          - all
        default: single
        required: true
      max_instances:
        description: "Tasks per selected arm (free-provider token/day limits apply)"
        type: choice
        options:
          - '1'
          - '3'
        default: '1'
        required: true
permissions:
  contents: read
concurrency:
  group: finance-agent-free-tier
  cancel-in-progress: false
jobs:
  trial:
    name: Free-tier controlled experiment
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      PYTHONUNBUFFERED: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Fail early if free API keys are missing
        run: |
          test -n "$GROQ_API_KEY" || { echo 'Set GROQ_API_KEY in repository Actions secrets' >&2; exit 1; }
          test -n "$TAVILY_API_KEY" || { echo 'Set TAVILY_API_KEY (1,000 free credits/month available)' >&2; exit 1; }
      - name: Check out source and pinned submodule
        uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - name: Confirm immutable upstream research code
        run: test "$(git -C upstream/agent-scaling rev-parse HEAD)" = '8673d6a8d5a764a07b08e4283492380d80257223'
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install pinned dependency environment
        working-directory: upstream/agent-scaling
        run: uv sync --prerelease=allow
      - name: Check out immutable Finance-Agent task source
        uses: actions/checkout@v4
        with:
          repository: vals-ai/finance-agent
          ref: 8ba65f81ab759a8e0d44e72aabc5a47cf839d563
          path: upstream/agent-scaling/third_party/finance-agent
          persist-credentials: false
      - name: Prepare pinned task dataset and verify queue registration
        working-directory: upstream/agent-scaling
        run: |
          test "$(git -C third_party/finance-agent rev-parse HEAD)" = '8ba65f81ab759a8e0d44e72aabc5a47cf839d563'
          bash scripts/setup_finance_agent.sh
          uv run --no-sync python - <<'PYCODE'
          import pathlib, sys
          sys.path.insert(0, str(pathlib.Path.cwd().parents[1]))
          from bloodninja.adapter import register_queued_agent
          register_queued_agent()
          from agent_scaling.agents.registry import get_agent_cls
          assert get_agent_cls('single-worker-queued').__name__ == 'SingleWorkerQueued'
          print('Q arm registered and runnable via original experiment evaluator')
          PYCODE
      - name: Execute model and grader with SAME free Groq account
        working-directory: upstream/agent-scaling
        env:
          MODEL: ${{ inputs.model || 'groq/qwen/qwen3.8-27b' }}
          N_TASKS: ${{ inputs.max_instances || '1' }}
          SELECTED_ARM: ${{ inputs.arm || 'all' }}
        run: |
          set -euo pipefail
          case "$SELECTED_ARM" in
            single) ARMS=(single-agent);;
            multi) ARMS=(multi-agent-centralized);;
            queue) ARMS=(single-worker-queued);;
            all) ARMS=(single-agent multi-agent-centralized single-worker-queued);;
            *) echo 'Unsupported arm' >&2; exit 2;;
          esac
          for ARM in "${ARMS[@]}"; do
            echo "Running $ARM on $N_TASKS task(s) with $MODEL; no paid API credentials"
            # Every arm uses the same strict rubric-grader patch. Upstream's
            # default silently scores provider outages as rubric failures.
            uv run --no-sync python ../../bloodninja/launch.py \
              "agent=${ARM}" dataset=finance-agent "llm.model=${MODEL}" \
              "dataset.eval_llm.model=${MODEL}" \
              "max_instances=${N_TASKS}" debug=false num_workers=1 \
              llm.params.temperature=0.0 use_disk_cache=false log_langfuse=false
            # The upstream runner can convert a failed task to accuracy=0
            # and still exit 0. Missing instance_save is a failed experiment.
            COUNT=$(find "exp_outputs/finance_agent/${ARM}" -name instance_save.yaml 2>/dev/null | wc -l)
            if [[ "${COUNT}" -ne "${N_TASKS}" ]]; then
              echo "INVALID: ${ARM} produced ${COUNT}/${N_TASKS} graded task records" >&2
              exit 1
            fi
          done
      - name: Export per-task metrics only, never transcripts or queue database
        if: always()
        shell: bash
        run: |
          mkdir -p metrics
          find upstream/agent-scaling/exp_outputs -name dataset_eval_metrics.json -print0 2>/dev/null |
            while IFS= read -r -d '' p; do
              dest="metrics/$(printf '%s' "$p" | sha256sum | cut -c1-16).json"
              cp "$p" "$dest"
            done
          if [[ -d upstream/agent-scaling/.venv ]]; then
            (cd upstream/agent-scaling && uv run --no-sync python ../../bloodninja/export_metrics.py \
              --root exp_outputs --out ../../metrics/paired-task-metrics.csv)
          fi
          if [[ "${{ inputs.arm }}" == "all" && -s metrics/paired-task-metrics.csv ]]; then
            python analyze.py metrics/paired-task-metrics.csv --reps 4000 > metrics/paired-bootstrap.txt || \
              echo 'Paired analysis unavailable: missing a complete S/M/Q task' > metrics/paired-bootstrap.txt
          fi
      - name: Upload sanitized scores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-agent-free-tier-metrics
          path: metrics/*
          if-no-files-found: warn
          retention-days: 30
